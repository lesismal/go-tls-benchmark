[package]
name = "benchcli-rustls"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[[bin]]
name = "benchcli-rustls"
path = "src/main.rs"

# aws-lc-rs as rustls's cryptography, as frameworks/rustls has it: rustls's
# default, and the one with the post-quantum X25519MLKEM768 key exchange
# crypto/tls negotiates for TLS 1.3.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std", "logging", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
