[package]
name = "rustls_server"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

# Pinned by Cargo.lock beside it, so every run measures the same library.
# aws-lc-rs rather than ring as the cryptography: it is rustls's default, and
# the one that has the post-quantum X25519MLKEM768 key exchange crypto/tls
# negotiates for TLS 1.3, so that every framework's handshakes are the same
# handshakes.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std", "logging", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
